<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Physics Visual Lab 使用知识库：检索实验操作、现象理解、故障排查和数据隐私问题。" />
    <title>使用知识库 | Physics Visual Lab</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./knowledge-base.css?v=kb-1" />
  </head>
  <body>
    <header class="kb-topbar">
      <a class="kb-brand" href="./index.html" aria-label="返回实验目录">
        <span class="kb-mark">Σ</span>
        <span><strong>PHYSICS VISUAL LAB</strong><small>使用知识库</small></span>
      </a>
      <nav aria-label="主导航"><a href="./index.html">实验目录</a><a class="is-current" href="./knowledge-base.html" aria-current="page">使用帮助</a></nav>
    </header>

    <main class="kb-shell">
      <section class="kb-search-band" aria-labelledby="kbTitle">
        <span class="eyebrow">SUPPORT KNOWLEDGE BASE</span>
        <h1 id="kbTitle">遇到了什么问题？</h1>
        <div class="kb-search" role="search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="kbSearch" type="search" autocomplete="off" placeholder="搜索：双缝没反应、全反射、坐标图、手机参数区…" aria-label="搜索知识库" aria-describedby="searchHint" />
          <button id="clearSearch" type="button" aria-label="清除搜索" hidden>×</button>
        </div>
        <p id="searchHint">可搜索现象、操作、设备、实验名称或物理关键词。</p>
      </section>

      <section class="kb-workspace" aria-labelledby="resultTitle">
        <aside class="kb-sidebar">
          <span class="sidebar-label">问题分类</span>
          <nav id="categoryNav" aria-label="知识库分类"></nav>
          <div id="contextPanel" class="context-panel" hidden>
            <span>当前实验</span>
            <strong id="contextLesson"></strong>
            <a id="backToLesson">返回实验</a>
          </div>
        </aside>

        <div class="kb-results">
          <header class="result-head">
            <div><span class="eyebrow">SEARCH RESULTS</span><h2 id="resultTitle">全部问题</h2></div>
            <p id="resultCount" aria-live="polite"></p>
          </header>
          <div id="articleList" class="article-list"></div>
          <div id="emptyState" class="empty-state" hidden>
            <strong>没有找到直接答案</strong>
            <p>换一个更短的关键词，或提交问题并说明实验名称、操作步骤与设备信息。</p>
            <a id="emptyFeedback" target="_blank" rel="noopener">提交新问题</a>
          </div>
        </div>
      </section>
    </main>

    <script src="./knowledge-base-data.js?v=kb-1"></script>
    <script src="./knowledge-base.js?v=kb-1"></script>
  </body>
</html>
